name: app_usage
description: Live glassy Android app usage counter with today's per-app totals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  dartz: ^0.10.1
  equatable: ^2.0.7
  gap: ^3.0.1
  shared_preferences: ^2.5.3
  intl: any
  usage_stats: ^2.0.1
  flutter_overlay_window: ^0.5.0
  google_fonts: ^8.2.1
  animated_notch_bottom_bar: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
